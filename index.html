<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduRegistrar - Iskolai Nyilvántartó Rendszer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Landing Page Specifikus Stílusok */
        body.landing-page {
            background: linear-gradient(135deg, #1e1e2f 0%, #0d0d16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            font-family: 'Outfit', sans-serif;
            position: relative;
        }

        /* Dekoratív Háttér Elemek */
        .landing-page::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: pulse-glow 8s infinite alternate;
        }

        .landing-page::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: pulse-glow 12s infinite alternate reverse;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .landing-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .landing-header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: slideDown 0.8s ease-out;
        }

        .landing-header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 0.5rem 0;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .landing-header p {
            font-size: 1.1rem;
            color: #9ca3af;
            max-width: 450px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .login-card {
            background: rgba(30, 30, 47, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: visible;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .login-card:hover {
            border-color: rgba(99, 102, 241, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .login-card:hover::before {
            transform: translateX(100%);
        }

        .login-icon-wrapper {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
        }

        .login-card h2 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }

        .login-card p.card-desc {
            color: #9ca3af;
            font-size: 1rem;
            margin: 0 0 2rem 0;
            line-height: 1.4;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .input-group {
            position: relative;
        }

        .input-group i.input-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            transition: color 0.3s;
            z-index: 10;
        }

        .login-input {
            width: 100%;
            padding: 1.1rem 1rem 1.1rem 3.2rem;
            background: rgba(15, 15, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .login-input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(15, 15, 22, 0.9);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .login-input:focus + i {
            color: #6366f1;
        }

        /* Autocomplete dropdown stílusok */
        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1e1e2f;
            border-radius: 14px;
            z-index: 999;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 5px;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            color: #e5e7eb;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .autocomplete-item i {
            color: #818cf8;
            font-size: 0.9rem;
        }

        .autocomplete-item:hover {
            background-color: rgba(99, 102, 241, 0.25);
            color: #ffffff;
            transform: translateX(4px);
        }

        .autocomplete-no-result {
            padding: 12px;
            color: #9ca3af;
            text-align: center;
            font-style: italic;
        }

        /* Password section animáció */
        #password-section {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .login-btn {
            padding: 1.1rem;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: linear-gradient(90deg, #6366f1, #4f46e5);
            color: white;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
            width: 100%;
        }

        .login-btn:hover {
            background: linear-gradient(90deg, #4f46e5, #4338ca);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="landing-page">
    <div class="landing-container">
        <header class="landing-header">
            <h1>EduRegistrar</h1>
            <p>Intelligens Duális Képzési és Iskolai Nyilvántartó Rendszer.</p>
        </header>

        <!-- Központi Iskolai Bejelentkező Kártya -->
        <div class="login-card">
            <div class="login-icon-wrapper">
                <i class="fas fa-university"></i>
            </div>
            <h2>Intézményi Bejelentkezés</h2>
            <p class="card-desc">Kezdje el beírni az iskola nevét, válassza ki a listából, majd adja meg a belépési kulcsot.</p>
            
            <form class="login-form" id="login-form" autocomplete="off">
                <!-- Autocomplete Iskola Kereső -->
                <div class="autocomplete-wrapper">
                    <div class="input-group">
                        <i class="fas fa-search input-icon"></i>
                        <input type="text" id="school-input" class="login-input" placeholder="Kezdje el gépelni az iskola nevét..." required autocomplete="off">
                    </div>
                    <div id="autocomplete-list" class="autocomplete-items" style="display: none;"></div>
                </div>

                <!-- Animáltan Megjelenő Jelszó Mező és Gomb -->
                <div id="password-section">
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password-input" class="login-input" placeholder="Belépési jelszó / API kulcs" required>
                    </div>
                    <button type="submit" class="login-btn">Belépés az Intézménybe</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allSchools = [];
        let selectedSchoolId = null;

        const schoolInput = document.getElementById('school-input');
        const autocompleteList = document.getElementById('autocomplete-list');
        const passwordSection = document.getElementById('password-section');
        const passwordInput = document.getElementById('password-input');
        const loginForm = document.getElementById('login-form');

        // Nyilvános iskolalista lekérése
        async function fetchSchools() {
            try {
                const response = await fetch('/schools/public');
                if (response.ok) {
                    allSchools = await response.json();
                } else {
                    console.error("Nem sikerült lekérni a nyilvános iskolalistát");
                }
            } catch (err) {
                console.error("Hálózati hiba az iskolalista lekérésekor:", err);
            }
        }

        // Keresés és autocomplete megjelenítés
        schoolInput.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            closeAllLists();
            
            // Ha a felhasználó szerkeszti az inputot, visszavonjuk a kiválasztást
            if (selectedSchoolId) {
                selectedSchoolId = null;
                hidePasswordSection();
            }

            if (!val) return;

            const filtered = allSchools.filter(school => 
                school.nev.toLowerCase().includes(val)
            );

            if (filtered.length === 0) {
                const noResultDiv = document.createElement('div');
                noResultDiv.className = 'autocomplete-no-result';
                noResultDiv.innerText = 'Nem található ilyen iskola';
                autocompleteList.appendChild(noResultDiv);
                autocompleteList.style.display = 'block';
                return;
            }

            filtered.forEach(school => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.innerHTML = `<i class="fas fa-graduation-cap"></i> <span>${school.nev}</span>`;
                item.addEventListener('click', function() {
                    schoolInput.value = school.nev;
                    selectedSchoolId = school.id;
                    closeAllLists();
                    showPasswordSection();
                });
                autocompleteList.appendChild(item);
            });

            autocompleteList.style.display = 'block';
        });

        function closeAllLists() {
            autocompleteList.innerHTML = '';
            autocompleteList.style.display = 'none';
        }

        function showPasswordSection() {
            passwordSection.style.maxHeight = '200px';
            passwordSection.style.opacity = '1';
            passwordInput.setAttribute('required', 'true');
            // Fókusz a jelszómezőre
            setTimeout(() => passwordInput.focus(), 300);
        }

        function hidePasswordSection() {
            passwordSection.style.maxHeight = '0';
            passwordSection.style.opacity = '0';
            passwordInput.removeAttribute('required');
            passwordInput.value = '';
        }

        // Kattintásra bezárjuk a listát
        document.addEventListener('click', function(e) {
            if (e.target !== schoolInput && e.target !== autocompleteList) {
                closeAllLists();
            }
        });

        // Belépés elküldése
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!selectedSchoolId) {
                alert("Kérjük válasszon ki egy intézményt a javaslatok közül!");
                return;
            }

            const password = passwordInput.value;

            try {
                const response = await fetch('/login/school', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        school_id: selectedSchoolId,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Token és iskola név elmentése
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('school_name', data.school_name);
                    
                    // Átirányítás az Admin Dashboardra
                    window.location.href = 'admin_dashboard.html';
                } else {
                    const errorData = await response.json();
                    alert(errorData.detail || "Sikertelen bejelentkezés! Ellenőrizze a kulcsot.");
                }
            } catch (err) {
                console.error("Hiba a belépés során:", err);
                alert("Hálózati hiba történt. Győződjön meg róla, hogy a szerver fut.");
            }
        });

        // Iskolák betöltése indításkor
        fetchSchools();
    </script>
</body>
</html>
